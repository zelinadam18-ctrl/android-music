name: iOS

# iOS tests and the Xcode build need a macOS runner. In a private repository macOS minutes
# count 10x against the free Actions allowance, so this only runs when iOS-relevant files
# change, once a week (to catch anything the path filter missed), and on demand.
on:
  pull_request:
    paths:
      - "iosApp/**"
      - "composeApp/src/iosMain/**"
      - "composeApp/build.gradle.kts"
      - "core/build.gradle.kts"
      - "database/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  push:
    branches: [master]
    paths:
      - "iosApp/**"
      - "composeApp/src/iosMain/**"
      - "composeApp/build.gradle.kts"
      - "core/build.gradle.kts"
      - "database/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/ios.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS tests and Xcode build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Shared tests on the iOS simulator
        run: ./gradlew --console=plain :core:iosSimulatorArm64Test :database:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Build the iOS app for the simulator
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -target iosApp
          -configuration Debug
          -sdk iphonesimulator
          -arch arm64
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Launch on an iPhone simulator
        run: |
          set -euo pipefail
          # Newest iOS runtime's first iPhone.
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, devs in sorted(runtimes.items(), reverse=True) if ".iOS-" in rt
                     for d in devs if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          app=$(find iosApp/build/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" "$bundle_id"
          sleep 10
          xcrun simctl io "$device" screenshot ios-simulator.png
          # The app must still be running, i.e. it didn't crash on start. (Save the list first:
          # piping into `grep -q` can kill launchctl with SIGPIPE, which pipefail reports as a failure.)
          xcrun simctl spawn "$device" launchctl list > launchctl.txt
          grep -q "$bundle_id" launchctl.txt
          echo "$bundle_id is running on $(xcrun simctl list devices | grep "$device" | sed 's/^ *//')"

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-screenshot
          path: ios-simulator.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
